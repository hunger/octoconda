[package]
name = "octoconda"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.100"
clap = { version = "4.5.51", features = ["derive"] }
octocrab = { version = "0.50.0", features = ["stream"] }

rattler = "0.41.0"
rattler_conda_types = "0.46.0"
rattler_networking = "0.27.0"
rattler_repodata_gateway = { version = "0.28.1", features = ["gateway"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0"
toml = { version = "1.0", features = ["serde", "parse"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "tracing", "io-std"] }
tokio-stream = "0.1.17"
url = { version = "2.5.7", features = ["serde"] }
tempfile = "3.23.0"
regex = "1.12.2"
rand = "0.10.1"
glob = "0.3.3"
futures = "0.3.32"
